project:
  type: website
  output-dir: docs

bibliography: references.bib
csl: apa.csl # optional, for styling

image: https://github.com/diopBachir/tp_modhydroclimat/blob/main/docs/images/raifall-runoff-model-illustr.png

website:
  title: "Hydro-Climatic Modelling Workflow: A Practical Guide"
  image: evaillustr.png
  open-graph: 
     title: "Hydro-Climatic Modelling Workflow: A Practical Guide"
     description: "Step-by-step hydro-climatic modelling"
     image: raifall-runoff-model-illustr.png
     locale: fr_FR
  favicon: raifall-runoff-model-illustr.png
  twitter-card: true
  site-url: https://diopbachir.github.io/tp_eva/index.html
  back-to-top-navigation: true
  page-navigation: true
  search: 
    location: navbar
    type: overlay
    copy-button: true
  navbar:
    collapse: true
    pinned: true
    background: "#536878"
    left:
      - href: introduction/index.qmd
        text: Introduction
      - href: softwaresetup/index.qmd
        text: Software & Setup
      - href: loaddata/index.qmd
        text: Database
      - href: modelcalib/index.qmd
        text: Model calibration
      - href: biascorr/index.qmd
        text: Bias correction
      - href: validation/index.qmd
        text: Validation
      - href: scenarios/index.qmd
        text: Climate scenarios
  page-footer:
    left: "© Copyright 2025"
    right: "Powered by <a href='https://quarto.org/'>Quarto</a>"
    center:
      - text: "Yves Tramblay <i class='fa-brands fa-orcid'></i>"
        href: http://orcid.org/0000-0003-0481-5330
      - text: "|"
      - text: "Serigne Bassirou Diop <i class='fa-brands fa-orcid'></i>"
        href: https://orcid.org/0009-0002-8743-3660
    background: "#536878"
  

date-format: "D MMMM YYYY"

format:
  html:
    # Table of contents
    toc: true
    toc-depth: 6
    toc-expand: 4
    toc-title: On this page
    toc-location: left
    toc-collapsible: true
    # Section numbering
    number-sections: true
    theme: 
      - styles.scss
    html-math-method: katex
    include-in-header:
      file: header.html
    anchor-sections: true
    smooth-scroll: true
    
    highlight-style: github
    code-block-border-left: "#31BAE9"

    code-overflow: scroll
    execute:
      message: false
      echo: false
      cache: false
      freeze: auto

fig-cap-location: bottom

engine: knitr
jupyter: python3
